<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>「ARCH」 SUIKA PROTOCOL</title>
  <link rel="icon" type="image/png" href="「ARCH」 Symbol Logo Black Ver.png">
  <link rel="apple-touch-icon" href="「ARCH」 Symbol Logo Black Ver.png">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+KR:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000000;
      --accent: #ffffff;
      --dim: rgba(255,255,255,0.4);
      --dimmer: rgba(255,255,255,0.1);
      /* 시스템 기본 폰트 폴백 추가 */
      --font: 'Orbitron', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; cursor: none !important; }
    ::-webkit-scrollbar { width: 2px; height: 2px; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); }

    body {
      background: #000;
      color: #fff;
      font-family: var(--font);
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    /* ── CURSOR ── */
    #cursor {
      position: fixed; width: 32px; height: 32px;
      border: 1px solid #fff; border-radius: 50%;
      pointer-events: none; transform: translate(-50%, -50%);
      z-index: 99999; transition: width .1s, height .1s, box-shadow .1s;
      box-shadow: 0 0 12px rgba(255,255,255,.4);
    }
    #cursor::before, #cursor::after {
      content: ''; position: absolute; background: #fff;
    }
    #cursor::before { top: 50%; left: -5px; right: -5px; height: 1px; }
    #cursor::after  { left: 50%; top: -5px; bottom: -5px; width: 1px; }
    #cursor.click { width: 14px !important; height: 14px !important; box-shadow: 0 0 25px #fff !important; }

    /* 모바일(터치 기기)에서는 커스텀 커서 숨김 및 기본 커서 허용 */
    @media (pointer: coarse) {
      #cursor { display: none !important; }
      * { cursor: auto !important; }
    }

    /* ── SCANLINE ── */
    .scanline {
      position: fixed; inset: 0;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,.018) 2px, rgba(255,255,255,.018) 4px);
      pointer-events: none; z-index: 9000;
    }

    @keyframes glitch {
      0%   { transform: translate(0); }
      20%  { transform: translate(-2px,1px); }
      40%  { transform: translate(-1px,-1px); }
      60%  { transform: translate(2px,1px); }
      80%  { transform: translate(1px,-1px); }
      100% { transform: translate(0); }
    }

    /* ── HEADER ── */
    header {
      position: fixed; top: 0; left: 0; right: 0; height: 58px;
      border-bottom: 1px solid rgba(255,255,255,.25);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 32px; background: rgba(0,0,0,.96);
      z-index: 500; box-shadow: 0 0 30px rgba(255,255,255,.06);
    }
    .hdr-left { display: flex; align-items: center; gap: 14px; }
    .hdr-title { font-size: 19px; font-weight: 900; letter-spacing: 3px; text-shadow: 0 0 18px rgba(255,255,255,.6); }
    .hdr-sub   { font-size: 10px; letter-spacing: 5px; color: var(--dim); }
    .hdr-right { font-size: 10px; color: rgba(255,255,255,.5); font-family: monospace; letter-spacing: 2px; text-align: right; line-height: 1.7; }
    .hdr-right span { color: #fff; }

    /* ── LAYOUT ── */
    #app {
      margin-top: 58px; height: calc(100vh - 58px);
      display: flex; align-items: stretch; justify-content: center;
      gap: 12px; padding: 14px 10px;
    }

    /* ── SIDE PANELS ── */
    .side { width: 210px; height: 100%; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; flex-shrink: 0; }

    .box {
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.025);
      padding: 14px 16px; position: relative;
    }
    .box::after {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.5), transparent);
    }
    .box-label { font-size: 8px; letter-spacing: 4px; color: rgba(255,255,255,.4); margin-bottom: 8px; }
    .box-val { font-size: 30px; font-weight: 900; text-shadow: 0 0 18px rgba(255,255,255,.6); }
    .box-val.sm { font-size: 20px; }

    /* Next preview */
    #next-wrap { display: flex; align-items: center; justify-content: center; padding: 6px 0 2px; }
    #next-canvas { border-radius: 50%; border: 1px solid rgba(255,255,255,.3); box-shadow: 0 0 14px rgba(255,255,255,.12); }

    /* How to play */
    .howto { font-size: 10px; line-height: 2; color: rgba(255,255,255,.55); }
    .howto b { color: #fff; font-family: var(--font); font-size: 9px; }

    /* Char list */
    #char-list { display: flex; flex-direction: column; gap: 3px; }
    .crow {
      display: flex; align-items: center; gap: 8px;
      padding: 4px 6px; border: 1px solid transparent;
      transition: all .2s;
    }
    .crow.on  { border-color: rgba(255,255,255,.15); }
    .crow.cur { border-color: rgba(255,255,255,.8); box-shadow: 0 0 8px rgba(255,255,255,.25); background: rgba(255,255,255,.05); }
    .cimg {
      width: 26px; height: 26px; border-radius: 50%; object-fit: cover;
      border: 1px solid rgba(255,255,255,.2);
      transition: filter .3s;
    }
    .crow:not(.on) .cimg { filter: brightness(0); }
    .crow:not(.on) .cname { color: rgba(255,255,255,.2); }
    .crow:not(.on) .cpts  { color: rgba(255,255,255,.1); }
    .cname { font-size: 8px; letter-spacing: 1px; color: rgba(255,255,255,.7); }
    .cpts  { font-size: 7px; color: rgba(255,255,255,.35); }

    /* ── GAME CANVAS ── */
    #game-wrap { 
      position: relative; 
      flex-shrink: 0; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
    }
    #gc {
      display: block;
      width: 100%;
      max-width: 380px;
      height: auto;
      aspect-ratio: 380 / 570;
      object-fit: contain;
      touch-action: none; /* 드래그 시 모바일 스크롤 방지 */
      border: 1px solid rgba(255,255,255,.45);
      box-shadow: 0 0 35px rgba(255,255,255,.07), inset 0 0 50px rgba(0,0,0,.6);
    }

    /* Game over overlay */
    #go-overlay {
      position: absolute; inset: 0;
      background: rgba(0,0,0,.93);
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 18px; border: 1px solid rgba(255,255,255,.6);
      backdrop-filter: blur(4px);
    }
    #go-overlay.on { display: flex; }
    .go-title { font-size: 22px; font-weight: 900; letter-spacing: 6px; text-shadow: 0 0 25px #fff; animation: glitch .15s infinite; text-align: center; }
    .go-sub   { font-size: 9px;  letter-spacing: 4px; color: rgba(255,255,255,.5); text-align: center; }
    .go-score { font-size: 12px; letter-spacing: 3px; color: rgba(255,255,255,.6); text-align: center; }
    .go-score span { color: #fff; font-size: 22px; font-weight: 900; display: block; margin-top: 4px; text-shadow: 0 0 15px #fff; }
    .btn-r {
      padding: 11px 32px; background: transparent;
      border: 1px solid #fff; color: #fff;
      font-family: var(--font); font-size: 10px; letter-spacing: 4px;
      font-weight: 700; transition: .25s; position: relative; overflow: hidden;
    }
    .btn-r::before {
      content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.4), transparent);
      transition: .4s;
    }
    .btn-r:hover { background: #fff; color: #000; box-shadow: 0 0 22px #fff; }
    .btn-r:hover::before { left: 100%; }

    /* ── NOTIFICATION ── */
    #notif {
      position: fixed; bottom: 22px; right: 22px;
      background: rgba(255,255,255,.95); color: #000;
      padding: 11px 18px; font-size: 10px; font-weight: 900;
      letter-spacing: 1px; display: none; z-index: 11000;
      border-left: 4px solid #000; max-width: 340px;
      box-shadow: 0 8px 28px rgba(255,255,255,.15);
    }
    @keyframes notifIn { from { transform: translateX(110%); opacity: 0; } to { transform: none; opacity: 1; } }

    /* ── SCORE POP ── */
    .score-pop {
      position: absolute; font-size: 13px; font-weight: 900;
      color: #fff; text-shadow: 0 0 12px #fff; pointer-events: none;
      animation: popUp .8s ease forwards; z-index: 100;
      font-family: var(--font); letter-spacing: 2px;
    }
    @keyframes popUp {
      0%   { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-50px); opacity: 0; }
    }
    
    /* ── CAPTURE BUTTON ── */
    #capture-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 14px 20px; background: transparent;
      border: 1px solid rgba(255,255,255,.5); color: rgba(255,255,255,.7);
      font-family: var(--font); font-size: 9px; letter-spacing: 3px; font-weight: 700;
      transition: .25s; position: relative; overflow: hidden;
      box-shadow: 0 0 10px rgba(255,255,255,.05);
    }
    #capture-btn::before {
      content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent);
      transition: .4s;
    }
    #capture-btn:hover { background: #fff; color: #000; border-color: #fff; box-shadow: 0 0 22px rgba(255,255,255,.5); }
    #capture-btn:hover::before { left: 100%; }
    #capture-btn.capturing { pointer-events: none; opacity: .5; }
    .cam-icon { font-size: 13px; line-height: 1; }

    /* Flash overlay */
    #flash {
      position: fixed; inset: 0; background: #fff;
      opacity: 0; pointer-events: none; z-index: 99999;
      transition: opacity .08s ease;
    }
    #flash.on { opacity: 0.7; }

    /* Share modal */
    #share-modal {
      position: fixed; inset: 0; background: rgba(0,0,0,.88);
      z-index: 50000; display: none; align-items: center; justify-content: center;
      backdrop-filter: blur(6px);
    }
    #share-modal.on { display: flex; }
    .share-box {
      border: 1px solid rgba(255,255,255,.5);
      background: #000; padding: 28px 28px 22px;
      display: flex; flex-direction: column; align-items: center; gap: 16px;
      max-width: 440px; width: 90%;
      box-shadow: 0 0 50px rgba(255,255,255,.08);
      position: relative;
    }
    .share-box::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, #fff, transparent);
    }
    .share-label { font-size: 9px; letter-spacing: 4px; color: rgba(255,255,255,.5); text-align: center; }
    .share-title { font-size: 16px; font-weight: 900; letter-spacing: 4px; text-shadow: 0 0 15px rgba(255,255,255,.6); text-align: center; }
    #share-preview {
      width: 100%; border: 1px solid rgba(255,255,255,.2);
      box-shadow: 0 0 20px rgba(255,255,255,.06);
      border-radius: 2px;
    }
    .share-btns { display: flex; gap: 10px; width: 100%; }
    .share-btn {
      flex: 1; padding: 11px 0; background: transparent;
      border: 1px solid rgba(255,255,255,.4); color: rgba(255,255,255,.8);
      font-family: var(--font); font-size: 9px; letter-spacing: 3px; font-weight: 700;
      transition: .2s; position: relative; overflow: hidden;
    }
    .share-btn.primary { border-color: #fff; color: #fff; box-shadow: 0 0 12px rgba(255,255,255,.15); }
    .share-btn:hover { background: #fff; color: #000; box-shadow: 0 0 20px #fff; }
    .share-close {
      font-size: 9px; letter-spacing: 3px; color: rgba(255,255,255,.3);
      border: none; background: transparent; font-family: var(--font);
      transition: color .2s; padding: 4px 12px;
    }
    .share-close:hover { color: #fff; }

    /* ── MOBILE RESPONSIVE LAYOUT ── */
    @media (max-width: 900px) {
      body { overflow-y: auto; overflow-x: hidden; }
      header { padding: 0 15px; }
      .hdr-title { font-size: 15px; }
      .hdr-sub { display: none; }
      
      #app {
        flex-direction: column;
        height: auto;
        padding-bottom: 40px;
        gap: 15px;
      }

      .side { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; overflow-y: visible; }
      
      #side-left { order: 1; grid-template-columns: 1fr 1fr 1fr; }
      #game-wrap { order: 2; width: 100%; margin: 0 auto; }
      #side-right { order: 3; display: flex; flex-direction: column; }

      .box-score { grid-column: 1; }
      .box-best { grid-column: 2; }
      .box-next { grid-column: 3; display: flex; flex-direction: column; align-items: center; padding: 8px; }
      #next-wrap { padding: 2px 0; }
      #next-canvas { width: 44px; height: 44px; }

      .box-capture { grid-column: 1 / -1; }
      .box-howto { grid-column: 1 / -1; }

      .box-val { font-size: 20px; }
      .box-val.sm { font-size: 16px; }

      #char-list { flex-direction: row; flex-wrap: wrap; justify-content: center; }
      .crow { flex: 1 1 30%; min-width: 90px; }
      
      #sys-log { max-height: 150px; }
    }

    /* ── THEME TOGGLE BUTTON ── */
    #theme-toggle {
      margin-left: 6px;
      padding: 5px 11px;
      background: transparent;
      border: 1px solid rgba(255,255,255,.35);
      color: rgba(255,255,255,.75);
      font-family: var(--font); font-size: 9px; letter-spacing: 2px; font-weight: 700;
      transition: .2s;
    }
    #theme-toggle:hover { background: #fff; color: #000; box-shadow: 0 0 14px rgba(127,127,127,.4); }

    /* ════════════════════════════════════════
       LIGHT MODE
       ════════════════════════════════════════ */
    body { transition: background .3s, color .3s; }

    body.light { background: #f4f4f6; color: #111; }
    body.light ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.3); }
    body.light #cursor { border-color: #000; box-shadow: 0 0 12px rgba(0,0,0,.3); }
    body.light #cursor::before, body.light #cursor::after { background: #000; }
    body.light .scanline {
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,.022) 2px, rgba(0,0,0,.022) 4px);
    }

    body.light header {
      background: rgba(255,255,255,.96);
      border-bottom-color: rgba(0,0,0,.18);
      box-shadow: 0 0 30px rgba(0,0,0,.05);
    }
    body.light .hdr-title { text-shadow: 0 0 18px rgba(0,0,0,.25); }
    body.light .hdr-sub { color: rgba(0,0,0,.4); }
    body.light .hdr-right { color: rgba(0,0,0,.5); }
    body.light .hdr-right span { color: #000; }

    body.light #theme-toggle { border-color: rgba(0,0,0,.3); color: rgba(0,0,0,.7); }
    body.light #theme-toggle:hover { background: #000; color: #fff; box-shadow: 0 0 14px rgba(0,0,0,.3); }

    body.light .box { border-color: rgba(0,0,0,.15); background: rgba(0,0,0,.025); }
    body.light .box::after { background: linear-gradient(90deg, transparent, rgba(0,0,0,.4), transparent); }
    body.light .box-label { color: rgba(0,0,0,.4); }
    body.light .box-val { text-shadow: 0 0 18px rgba(0,0,0,.2); }
    body.light .howto { color: rgba(0,0,0,.6); }
    body.light .howto b { color: #000; }
    body.light #next-canvas { border-color: rgba(0,0,0,.3); box-shadow: 0 0 14px rgba(0,0,0,.08); }

    body.light .crow.on { border-color: rgba(0,0,0,.15); }
    body.light .crow.cur { border-color: rgba(0,0,0,.8); box-shadow: 0 0 8px rgba(0,0,0,.2); background: rgba(0,0,0,.05); }
    body.light .cimg { border-color: rgba(0,0,0,.2); }
    body.light .crow:not(.on) .cimg { filter: brightness(0) opacity(.15); }
    body.light .crow:not(.on) .cname { color: rgba(0,0,0,.25); }
    body.light .crow:not(.on) .cpts { color: rgba(0,0,0,.12); }
    body.light .cname { color: rgba(0,0,0,.7); }
    body.light .cpts { color: rgba(0,0,0,.4); }
    body.light #sys-log { color: rgba(0,0,0,.5) !important; }

    body.light #gc {
      border-color: rgba(0,0,0,.35);
      box-shadow: 0 0 35px rgba(0,0,0,.08), inset 0 0 50px rgba(0,0,0,.04);
    }

    body.light #capture-btn {
      border-color: rgba(0,0,0,.4); color: rgba(0,0,0,.7);
      box-shadow: 0 0 10px rgba(0,0,0,.04);
    }
    body.light #capture-btn::before { background: linear-gradient(90deg, transparent, rgba(0,0,0,.25), transparent); }
    body.light #capture-btn:hover { background: #000; color: #fff; border-color: #000; box-shadow: 0 0 22px rgba(0,0,0,.4); }

    body.light #go-overlay { background: rgba(244,244,246,.94); border-color: rgba(0,0,0,.6); }
    body.light .go-title { text-shadow: 0 0 25px rgba(0,0,0,.4); }
    body.light .go-sub { color: rgba(0,0,0,.5); }
    body.light .go-score { color: rgba(0,0,0,.6); }
    body.light .go-score span { color: #000; text-shadow: 0 0 15px rgba(0,0,0,.3); }
    body.light .btn-r { border-color: #000; color: #000; }
    body.light .btn-r::before { background: linear-gradient(90deg, transparent, rgba(0,0,0,.25), transparent); }
    body.light .btn-r:hover { background: #000; color: #fff; box-shadow: 0 0 22px rgba(0,0,0,.35); }

    body.light #notif {
      background: rgba(17,17,17,.96); color: #fff;
      border-left-color: #fff; box-shadow: 0 8px 28px rgba(0,0,0,.2);
    }
    body.light .score-pop { color: #000; text-shadow: 0 0 12px rgba(0,0,0,.3); }
  </style>
</head>
<body>

<div id="cursor"></div>
<div class="scanline"></div>
<div id="notif"></div>
<div id="flash"></div>

<div id="share-modal">
  <div class="share-box">
    <div class="share-label">SCORE_RECORD_CAPTURED</div>
    <div class="share-title">「ARCH」 SUIKA PROTOCOL</div>
    <img id="share-preview" src="" alt="capture">
    <div class="share-btns">
      <button class="share-btn primary" onclick="downloadCapture()">[ DOWNLOAD ]</button>
      <button class="share-btn" onclick="shareCapture()" id="share-native-btn">[ SHARE ]</button>
    </div>
    <button class="share-close" onclick="closeShareModal()">[ CLOSE ]</button>
  </div>
</div>

<header>
  <div class="hdr-left">
    <div class="hdr-title">「ARCH」</div>
    <div class="hdr-sub">| SUIKA_PROTOCOL</div>
    <button id="theme-toggle" onclick="toggleTheme()">◐ <span id="theme-label">LIGHT</span></button>
  </div>
  <div class="hdr-right">
    SYSTEM: <span>ONLINE</span><br>
    <span id="clock">00:00:00</span> KST
  </div>
</header>

<div id="app">

  <div class="side" id="side-left">
    <div class="box box-score">
      <div class="box-label">SCORE</div>
      <div class="box-val" id="score-disp">0</div>
    </div>
    <div class="box box-best">
      <div class="box-label">BEST</div>
      <div class="box-val sm" id="best-disp">0</div>
    </div>
    <div class="box box-next">
      <div class="box-label">NEXT</div>
      <div id="next-wrap">
        <canvas id="next-canvas" width="72" height="72"></canvas>
      </div>
    </div>
    <button id="capture-btn" class="box-capture" onclick="captureScreen()">
      <span class="cam-icon">⊡</span> CAPTURE_SCORE
    </button>
    <div class="box box-howto">
      <div class="box-label">HOW TO PLAY</div>
      <div class="howto">
        <b>CLICK / TOUCH</b> — 유닛 투하 & 위치 조준<br>
        <b>SAME × 2</b> — 상위 유닛 합성<br>
        <b>OVERFLOW</b> — 상단 경계를 넘을 시 종료
      </div>
    </div>
  </div>

  <div id="game-wrap">
    <canvas id="gc"></canvas>
    <div id="go-overlay">
      <div class="go-title">UNIT_OVERFLOW</div>
      <div class="go-sub">FUSION_PROTOCOL_TERMINATED</div>
      <div class="go-score">FINAL_SCORE<span id="final-score">0</span></div>
      <button class="btn-r" onclick="restartGame()">[ REINITIALIZE ]</button>
    </div>
  </div>

  <div class="side" id="side-right">
    <div class="box box-db" style="flex:1; overflow-y:auto;">
      <div class="box-label">UNIT DATABASE</div>
      <div id="char-list"></div>
    </div>
    <div class="box box-log">
      <div class="box-label">SYSTEM LOG</div>
      <div id="sys-log" style="font-size:9px; color:rgba(255,255,255,.4); font-family:monospace; line-height:1.9; max-height:120px; overflow-y:auto; word-break: break-all;"></div>
    </div>
  </div>

</div>

<script>
// ═══════════════════════════════════════════
//  「ARCH」 SUIKA PROTOCOL — GAME ENGINE
// ═══════════════════════════════════════════

// ── CONFIG ──
const UNITS = [
  { id:1,  img:'A1.png',  r:15, pts:1,  name:'ASH'      },
  { id:2,  img:'A2.png',  r:20, pts:3,  name:'SHANE'    },
  { id:3,  img:'A3.png',  r:26, pts:6,  name:'WINTER'   },
  { id:4,  img:'A4.png',  r:32, pts:10, name:'RIME'     },
  { id:5,  img:'A5.png',  r:38, pts:15, name:'KATO'     },
  { id:6,  img:'A6.png',  r:44, pts:21, name:'BLUE'     },
  { id:7,  img:'A7.png',  r:51, pts:28, name:'PIKA'     },
  { id:8,  img:'A8.png',  r:58, pts:36, name:'OVERLOAD' },
  { id:9,  img:'A9.png',  r:65, pts:45, name:'AMORE'    },
  { id:10, img:'A10.png', r:73, pts:55, name:'SANTA'    },
  { id:11, img:'A11.png', r:82, pts:66, name:'EDEN'     },
];

const CW = 380, CH = 570;
const DANGER_Y = 62;   
const DROP_Y   = 42;   
const GO_DELAY = 2000; 

// ── IMAGE LOADER ──
const imgs = {};
let loadedCount = 0;

function loadImages(cb) {
  UNITS.forEach(u => {
    const img = new Image();
    img.onload = img.onerror = () => { if (++loadedCount >= UNITS.length) cb(); };
    img.src = u.img;
    imgs[u.id] = img;
  });
}

// ── MATTER.JS ALIASES ──
const { Engine, Bodies, Body, World, Events, Runner } = Matter;

// ── STATE ──
let engine, world, runner;
let fruits = [];
let mergeQueue = [];
let pendingIds = new Set();
let particles = [];
let scorePopEls = [];

let score = 0;
let bestScore = +(localStorage.getItem('arch_suika_best') || 0);
let lightMode = localStorage.getItem('arch_suika_theme') === 'light';
let curLevel = 1, nextLevel = 1;
let canDrop = true;
let dropX = CW / 2;
let gameOver = false;
let dangerTimer = 0;
let unlocked = new Set([1, 2, 3]);

// ── CANVAS ──
const canvas = document.getElementById('gc');
canvas.width = CW; canvas.height = CH;
const ctx = canvas.getContext('2d');

// ── 터치/마우스 좌표 보정 ──
function getScale() {
  const rect = canvas.getBoundingClientRect();
  return canvas.width / rect.width;
}

// ── PHYSICS INIT ──
function initPhysics() {
  engine = Engine.create({ gravity: { x: 0, y: 1.6 } });
  world = engine.world;

  const wallOpts = { isStatic: true, label: 'wall', friction: 0.4, restitution: 0.15, slop: 0.05 };
  const T = 40;
  World.add(world, Bodies.rectangle(CW/2, CH + T/2, CW + T*2, T, wallOpts)); 
  World.add(world, Bodies.rectangle(-T/2, CH/2, T, CH*2, wallOpts)); 
  World.add(world, Bodies.rectangle(CW + T/2, CH/2, T, CH*2, wallOpts)); 

  runner = Runner.create();
  Runner.run(runner, engine);
  Events.on(engine, 'collisionStart', onCollision);
}

function onCollision(evt) {
  if (gameOver) return;
  for (const { bodyA, bodyB } of evt.pairs) {
    if (
      bodyA.label === 'fruit' && bodyB.label === 'fruit' &&
      bodyA.gameLevel === bodyB.gameLevel && bodyA.gameLevel < 11 &&
      !pendingIds.has(bodyA.id) && !pendingIds.has(bodyB.id)
    ) {
      pendingIds.add(bodyA.id);
      pendingIds.add(bodyB.id);
      mergeQueue.push({ a: bodyA, b: bodyB, lvl: bodyA.gameLevel });
    }
  }
}

// ── FACTORY & LOGIC ──
function makeFruit(x, y, level) {
  const r = UNITS[level - 1].r;
  const b = Bodies.circle(x, y, r, {
    label: 'fruit', restitution: 0.25, friction: 0.5,
    frictionAir: 0.008, density: 0.002, slop: 0.05,
  });
  b.gameLevel = level;
  b.spawnTime = Date.now();
  return b;
}

function dropUnit(x) {
  if (!canDrop || gameOver) return;
  canDrop = false;

  const r = UNITS[curLevel - 1].r;
  const cx = clamp(x, r + 2, CW - r - 2);
  const b = makeFruit(cx, DROP_Y, curLevel);
  World.add(world, b);
  fruits.push(b);

  curLevel  = nextLevel;
  nextLevel = randLevel();
  updateUI();

  addLog(`DROP: ${UNITS[b.gameLevel-1].name} → [${Math.round(cx)}, ${DROP_Y}]`);
  setTimeout(() => { canDrop = true; }, 550);
}

function randLevel() {
  return Math.ceil(Math.random() * Math.min(5, Math.max(...unlocked)));
}

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function processMerges() {
  if (!mergeQueue.length) return;
  const queue = mergeQueue.splice(0);

  for (const { a, b, lvl } of queue) {
    if (!fruits.includes(a) || !fruits.includes(b)) {
      pendingIds.delete(a.id); pendingIds.delete(b.id);
      continue;
    }
    const mx = (a.position.x + b.position.x) / 2;
    const my = (a.position.y + b.position.y) / 2;
    const newLvl = lvl + 1;

    World.remove(world, a); World.remove(world, b);
    fruits = fruits.filter(f => f !== a && f !== b);
    pendingIds.delete(a.id); pendingIds.delete(b.id);

    const pts = UNITS[newLvl - 1].pts;
    score += pts;
    unlocked.add(newLvl);

    particles.push({ x: mx, y: my, r: UNITS[newLvl-1].r * 1.2, alpha: 0.9, dr: 5 });
    particles.push({ x: mx, y: my, r: UNITS[newLvl-1].r * 0.5, alpha: 0.6, dr: 3 });
    spawnScorePop(mx, my, `+${pts}`);

    if (newLvl <= 11) {
      const ny = clamp(my, UNITS[newLvl-1].r + DANGER_Y, CH - UNITS[newLvl-1].r - 5);
      const nb = makeFruit(mx, ny, newLvl);
      World.add(world, nb);
      fruits.push(nb);
      Body.setVelocity(nb, { x: 0, y: -2.5 });
    }

    updateUI();
    notify(`FUSION: ${UNITS[lvl-1].name} ×2 → ${UNITS[newLvl-1].name}`);
    addLog(`MERGE: LV${lvl}+LV${lvl} → LV${newLvl}`);
  }
}

function spawnScorePop(x, y, text) {
  const el = document.createElement('div');
  el.className = 'score-pop';
  el.textContent = text;
  
  const rect = canvas.getBoundingClientRect();
  const scale = rect.width / canvas.width;
  
  el.style.left = (rect.left + x * scale) + 'px';
  el.style.top  = (rect.top + y * scale - 10) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 850);
}

function triggerGameOver() {
  if (gameOver) return;
  gameOver = true;
  Runner.stop(runner);
  if (score > bestScore) {
    bestScore = score;
    localStorage.setItem('arch_suika_best', bestScore);
  }
  document.getElementById('final-score').textContent = score.toLocaleString();
  document.getElementById('go-overlay').classList.add('on');
  notify('UNIT_OVERFLOW_DETECTED');
  addLog('!!! OVERFLOW TERMINATED');
}

function restartGame() {
  document.getElementById('go-overlay').classList.remove('on');
  gameOver = false; canDrop = true; dangerTimer = 0;
  score = 0; fruits = []; mergeQueue = []; pendingIds.clear(); particles = [];
  unlocked = new Set([1,2,3]);

  Runner.stop(runner);
  World.clear(world); Engine.clear(engine);
  initPhysics();

  curLevel  = Math.ceil(Math.random() * 3);
  nextLevel = randLevel();
  updateUI();
  notify('REINITIALIZING PROTOCOL...');
  addLog('--- RESTART ---');
}

// ── RENDER ──
function draw() {
  ctx.clearRect(0, 0, CW, CH);
  ctx.fillStyle = lightMode ? '#ececed' : '#000';
  ctx.fillRect(0, 0, CW, CH);

  ctx.strokeStyle = lightMode ? 'rgba(0,0,0,.04)' : 'rgba(255,255,255,.025)';
  ctx.lineWidth = 1;
  for (let x = 0; x <= CW; x += 38) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,CH); ctx.stroke(); }
  for (let y = 0; y <= CH; y += 38) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(CW,y); ctx.stroke(); }

  const dangerAlpha = 0.12 + 0.08 * Math.sin(Date.now() / 300);
  const dCh = lightMode ? '0,0,0' : '255,255,255';
  ctx.fillStyle = `rgba(${dCh},${dangerAlpha * (dangerTimer > 0 ? 2.5 : 1)})`;
  ctx.fillRect(0, 0, CW, DANGER_Y);

  ctx.setLineDash([6,5]);
  ctx.strokeStyle = dangerTimer > 0 ? `rgba(${dCh},${0.6 + 0.4*Math.sin(Date.now()/150)})` : `rgba(${dCh},.28)`;
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0,DANGER_Y); ctx.lineTo(CW,DANGER_Y); ctx.stroke();
  ctx.setLineDash([]);

  if (dangerTimer > 0) {
    ctx.font = '700 9px Orbitron, sans-serif';
    ctx.fillStyle = `rgba(${dCh},${0.5+0.5*Math.sin(Date.now()/120)})`;
    ctx.textAlign = 'right';
    ctx.fillText('!! OVERFLOW_IMMINENT', CW - 8, DANGER_Y - 5);
    ctx.textAlign = 'left';
  }

  if (canDrop && !gameOver) {
    const r = UNITS[curLevel-1].r;
    const gx = clamp(dropX, r+2, CW-r-2);
    ctx.strokeStyle = lightMode ? 'rgba(0,0,0,.15)' : 'rgba(255,255,255,.1)';
    ctx.lineWidth = 1; ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(gx,DROP_Y+r); ctx.lineTo(gx,CH); ctx.stroke();
    ctx.setLineDash([]);
    drawUnit(gx, DROP_Y, r, curLevel, .55);
  }

  particles = particles.filter(p => {
    p.alpha -= .045; p.r += p.dr * .5;
    if (p.alpha <= 0) return false;
    ctx.save(); ctx.globalAlpha = p.alpha;
    ctx.strokeStyle = lightMode ? '#000' : '#fff'; ctx.lineWidth = 2;
    ctx.shadowColor = lightMode ? '#000' : '#fff'; ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.stroke();
    ctx.restore(); return true;
  });

  for (const b of fruits) {
    ctx.save(); ctx.translate(b.position.x, b.position.y); ctx.rotate(b.angle);
    drawUnit(0, 0, UNITS[b.gameLevel-1].r, b.gameLevel, 1);
    ctx.restore();
  }
}

function drawUnit(x, y, r, level, alpha) {
  const img = imgs[level];
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.clip();

  if (img && img.complete && img.naturalWidth > 0) {
    ctx.drawImage(img, x-r, y-r, r*2, r*2);
  } else {
    ctx.fillStyle = '#111'; ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = `900 ${r*.55}px Orbitron, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(level, x, y);
  }
  ctx.restore(); ctx.save(); ctx.globalAlpha = alpha;
  ctx.strokeStyle = lightMode ? 'rgba(0,0,0,.5)' : 'rgba(255,255,255,.65)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.stroke();
  ctx.strokeStyle = lightMode ? 'rgba(0,0,0,.08)' : 'rgba(255,255,255,.12)'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.arc(x, y, r+1, 0, Math.PI*2); ctx.stroke();
  ctx.restore();
}

function drawNextPreview() {
  const nc = document.getElementById('next-canvas');
  const nx = nc.getContext('2d');
  nx.clearRect(0,0,72,72);
  nx.fillStyle = lightMode ? '#ececed' : '#000'; nx.fillRect(0,0,72,72);

  const r = UNITS[nextLevel-1].r;
  const scale = Math.min(30/r, 1);
  nx.save(); nx.translate(36, 36); nx.scale(scale, scale);
  
  const img = imgs[nextLevel];
  nx.beginPath(); nx.arc(0,0,r,0,Math.PI*2); nx.clip();
  if (img && img.complete && img.naturalWidth > 0) {
    nx.drawImage(img, -r, -r, r*2, r*2);
  } else {
    nx.fillStyle = '#111'; nx.fill(); nx.fillStyle = '#fff';
    nx.font = `900 ${r*.55}px Orbitron, sans-serif`;
    nx.textAlign = 'center'; nx.textBaseline = 'middle';
    nx.fillText(nextLevel, 0, 0);
  }
  nx.restore();
  nx.strokeStyle = lightMode ? 'rgba(0,0,0,.3)' : 'rgba(255,255,255,.3)'; nx.lineWidth = 1;
  nx.beginPath(); nx.arc(36,36,35,0,Math.PI*2); nx.stroke();
}

// ── UI UPDATE ──
function updateUI() {
  document.getElementById('score-disp').textContent = score.toLocaleString();
  document.getElementById('best-disp').textContent  = bestScore.toLocaleString();
  drawNextPreview(); updateCharList();
}

function updateCharList() {
  const list = document.getElementById('char-list');
  list.innerHTML = '';
  UNITS.forEach(u => {
    const isOn = unlocked.has(u.id); const isCur = u.id === curLevel;
    const row = document.createElement('div');
    row.className = `crow ${isOn?'on':''} ${isCur?'cur':''}`;
    row.innerHTML = `<img class="cimg" src="${u.img}" onerror="this.style.opacity='.15'">
      <div><div class="cname">${isOn ? u.name : '???'}</div>
      <div class="cpts">${isOn ? '+'+u.pts+' PTS' : '- - -'}</div></div>`;
    list.appendChild(row);
  });
}

let notifTimer;
function notify(msg) {
  const el = document.getElementById('notif');
  el.textContent = `>> ${msg}`;
  el.style.display = 'block'; el.style.animation = 'none'; void el.offsetWidth;
  el.style.animation = 'notifIn .3s forwards';
  clearTimeout(notifTimer);
  notifTimer = setTimeout(() => { el.style.display='none'; }, 3200);
}

let logLines = [];
function addLog(msg) {
  logLines.push(msg);
  if (logLines.length > 12) logLines.shift();
  const el = document.getElementById('sys-log');
  el.textContent = logLines.join('\n');
  el.scrollTop = el.scrollHeight;
}

// ── LOOP ──
let lastTS = 0;
function loop(ts) {
  const dt = ts - lastTS; lastTS = ts;
  if (!gameOver) {
    processMerges();
    let inDanger = false; const now = Date.now();
    for (const b of fruits) {
      if (now - b.spawnTime > 1000 && Math.abs(b.velocity.y) < 1.2 && Math.abs(b.velocity.x) < 1.2 && (b.position.y - UNITS[b.gameLevel-1].r) < DANGER_Y) {
        inDanger = true; break;
      }
    }
    if (inDanger) { dangerTimer += dt; if (dangerTimer >= GO_DELAY) triggerGameOver(); }
    else dangerTimer = 0;
  }
  draw(); requestAnimationFrame(loop);
}

// ── INPUT (Mouse & Touch Scaled) ──
const cursorEl = document.getElementById('cursor');
document.addEventListener('mousemove', e => {
  cursorEl.style.left = e.clientX + 'px'; cursorEl.style.top  = e.clientY + 'px';
});
document.addEventListener('mousedown', () => cursorEl.classList.add('click'));
document.addEventListener('mouseup',   () => cursorEl.classList.remove('click'));

canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  dropX = (e.clientX - r.left) * getScale();
});
canvas.addEventListener('click', e => {
  const r = canvas.getBoundingClientRect();
  dropUnit((e.clientX - r.left) * getScale());
});

canvas.addEventListener('touchmove', e => {
  e.preventDefault(); 
  const r = canvas.getBoundingClientRect();
  dropX = (e.touches[0].clientX - r.left) * getScale();
}, { passive: false });

canvas.addEventListener('touchend', e => {
  const r = canvas.getBoundingClientRect();
  dropUnit((e.changedTouches[0].clientX - r.left) * getScale());
});

// ── THEME ──
function applyTheme() {
  document.body.classList.toggle('light', lightMode);
  const lbl = document.getElementById('theme-label');
  if (lbl) lbl.textContent = lightMode ? 'DARK' : 'LIGHT';
}
function toggleTheme() {
  lightMode = !lightMode;
  localStorage.setItem('arch_suika_theme', lightMode ? 'light' : 'dark');
  applyTheme();
  drawNextPreview();
  notify(lightMode ? 'LIGHT_MODE_ENGAGED' : 'DARK_MODE_ENGAGED');
}

// ── CAPTURE & SHARE ──
let capturedDataURL = null;
async function captureScreen() {
  const btn = document.getElementById('capture-btn');
  btn.classList.add('capturing'); btn.innerHTML = '...';
  const flash = document.getElementById('flash');
  flash.classList.add('on'); setTimeout(() => flash.classList.remove('on'), 120);

  try {
    const gameCanvas = document.getElementById('gc');
    const GW = gameCanvas.width, GH = gameCanvas.height, BANNER = 80, PAD = 24;
    const out = document.createElement('canvas');
    out.width = GW; out.height = GH + BANNER;
    const oc = out.getContext('2d');

    oc.drawImage(gameCanvas, 0, 0);

    if (fruits.length === 0) {
      const cx = GW/2, cy = GH/2;
      const grad = oc.createRadialGradient(cx,cy,10,cx,cy,160);
      grad.addColorStop(0, 'rgba(255,255,255,0.07)'); grad.addColorStop(1, 'rgba(255,255,255,0)');
      oc.fillStyle = grad; oc.beginPath(); oc.arc(cx,cy,160,0,Math.PI*2); oc.fill();
      oc.strokeStyle = 'rgba(255,255,255,0.12)'; oc.lineWidth=1;
      oc.beginPath(); oc.arc(cx,cy,90,0,Math.PI*2); oc.stroke();
      oc.fillStyle = 'rgba(255,255,255,0.55)'; oc.font = '900 18px Orbitron, sans-serif'; oc.textAlign = 'center';
      oc.fillText('「ARCH」', cx, cy-14);
    }

    oc.fillStyle = 'rgba(0,0,0,0.75)'; oc.fillRect(0,0,GW,38);
    oc.fillStyle = 'rgba(255,255,255,0.55)'; oc.font = '700 10px Orbitron, sans-serif'; oc.textAlign = 'left';
    oc.fillText('「ARCH」 SUIKA PROTOCOL', PAD, 24);

    const BY = GH;
    oc.fillStyle = '#000'; oc.fillRect(0, BY, GW, BANNER);
    oc.strokeStyle = 'rgba(255,255,255,0.4)'; oc.beginPath(); oc.moveTo(0,BY); oc.lineTo(GW,BY); oc.stroke();
    oc.fillStyle = 'rgba(255,255,255,0.4)'; oc.font = '700 9px Orbitron, sans-serif';
    oc.fillText('CURRENT_SCORE', PAD+12, BY+26);
    oc.fillStyle = '#ffffff'; oc.font = '900 28px Orbitron, sans-serif';
    oc.fillText(score.toLocaleString(), PAD+12, BY+58);
    oc.fillStyle = 'rgba(255,255,255,0.35)'; oc.textAlign = 'right'; oc.fillText('BEST', GW-PAD, BY+26);
    oc.fillStyle = 'rgba(255,255,255,0.7)'; oc.font = '700 16px Orbitron, sans-serif'; oc.fillText(bestScore.toLocaleString(), GW-PAD, BY+50);

    capturedDataURL = out.toDataURL('image/png');
    document.getElementById('share-preview').src = capturedDataURL;
    document.getElementById('share-modal').classList.add('on');
    document.getElementById('share-native-btn').style.display = navigator.share ? '' : 'none';
    notify('SCORE_RECORD_CAPTURED');
  } catch (e) {
    notify('CAPTURE_FAILED: ' + e.message); console.error(e);
  }
  btn.classList.remove('capturing'); btn.innerHTML = '<span class="cam-icon">⊡</span> CAPTURE_SCORE';
}

function downloadCapture() {
  if (!capturedDataURL) return;
  const a = document.createElement('a');
  a.href = capturedDataURL; a.download = `ARCH_SUIKA_${score}_${Date.now()}.png`; a.click();
  notify('IMAGE_SAVED'); closeShareModal();
}

async function shareCapture() {
  if (!capturedDataURL || !navigator.share) return;
  try {
    const blob = await (await fetch(capturedDataURL)).blob();
    const file = new File([blob], `ARCH_SUIKA_${score}.png`, { type: 'image/png' });
    await navigator.share({ title: '「ARCH」 SUIKA PROTOCOL', text: `SCORE: ${score.toLocaleString()}`, files: [file] });
  } catch (e) {}
  closeShareModal();
}
function closeShareModal() { document.getElementById('share-modal').classList.remove('on'); }
document.getElementById('share-modal').addEventListener('click', function(e){ if(e.target===this) closeShareModal(); });

setInterval(() => { document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-GB'); }, 1000);

// ── BOOT (폰트 보장) ──
window.onload = async () => {
  applyTheme();
  if (document.fonts && document.fonts.ready) {
    await document.fonts.ready;
  }
  loadImages(() => {
    initPhysics();
    curLevel  = Math.ceil(Math.random() * 3);
    nextLevel = randLevel();
    unlocked  = new Set([1, 2, 3]);
    updateUI();
    addLog('SYSTEM_ONLINE');
    notify('SYSTEM ONLINE');
    requestAnimationFrame(loop);
  });
};
</script>
